name: Validate Memo CI workflow syntax

'on':
  pull_request:
    branches:
      - ysfclc-patch-1

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint the Android build workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.7.7'
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/build-apk.yml
