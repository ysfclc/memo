
name: Build Memo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Memo-Android-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: memo-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Memo-Android-source.zip
          unzip -t Memo-Android-source.zip
          mkdir -p _memo_source
          unzip -q Memo-Android-source.zip -d _memo_source
          test -f _memo_source/Memo-Android/app/build.gradle
          test -f _memo_source/Memo-Android/settings.gradle
          chmod +x _memo_source/Memo-Android/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build APK
        working-directory: _memo_source/Memo-Android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="_memo_source/Memo-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" > memo-apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: memo-android-debug-apk
          path: |
            _memo_source/Memo-Android/app/build/outputs/apk/debug/app-debug.apk
            memo-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
          
