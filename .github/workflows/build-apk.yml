name: Memo — Import source ZIP and build Android APK

'on':
  push:
    branches:
      - main
    paths:
      - '.circleci/**'
      - 'incoming/memo.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'tools/**'
      - 'MEMO2_ALIGNMENT_MATRIX.md'
      - 'PRODUCT_GAP_REGISTRY.md'
      - 'FEATURE_AUDIT.md'
      - 'ROADMAP.md'
      - 'TASKS.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'settings.gradle.kts'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memo-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the one incoming/memo.zip upload
    runs-on: ubuntu-latest
    outputs:
      skip_no_upload: ${{ steps.resolve.outputs.skip_no_upload }}
      already_imported: ${{ steps.resolve.outputs.already_imported }}
      upload_commit: ${{ steps.resolve.outputs.upload_commit }}
      archive_sha: ${{ steps.resolve.outputs.archive_sha }}
      source_only: ${{ steps.resolve.outputs.source_only }}
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the upload commit and enforce the single-ZIP contract
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "$GITHUB_BASE_REF" != "main" ]]; then
              echo "::error::Memo CI pull-request validation is restricted to main. Base: $GITHUB_BASE_REF"
              exit 1
            fi
            ARCHIVE_SHA="$(sha256sum SOURCE_SHA256SUMS.txt | awk '{print $1}')"
            {
              echo 'skip_no_upload=false'
              echo 'already_imported=false'
              echo "upload_commit=$GITHUB_SHA"
              echo "archive_sha=$ARCHIVE_SHA"
              echo 'source_only=true'
            } >> "$GITHUB_OUTPUT"
            echo 'Pull-request source validation: no import, signing or repository write will run.'
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Memo source imports are restricted to main. Current ref: $GITHUB_REF"
            exit 1
          fi

          CHANGED_FILES="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" 2>/dev/null || git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA")"
          DIRECT_SOURCE_CHANGE="$(printf '%s\n' "$CHANGED_FILES" | grep -Ec '^(.circleci/|.github/workflows/build-apk.yml|app/|core/|gradle/|tools/|docs/|README[.]md$|TASKS[.]md$|ROADMAP[.]md$|FEATURE_AUDIT[.]md$|PRODUCT_GAP_REGISTRY[.]md$|MEMO2_ALIGNMENT_MATRIX[.]md$|CHANGELOG[.]md$|.*[.]gradle([.]kts)?$|gradle[.]properties$|settings[.]gradle([.]kts)?$)' || true)"
          INCOMING_ARCHIVE_CHANGE="$(printf '%s\n' "$CHANGED_FILES" | grep -Ec '^incoming/memo[.]zip$' || true)"
          mapfile -t PRESENT_ZIPS < <(find incoming -maxdepth 1 -type f -iname '*.zip' -print 2>/dev/null | sort)

          SOURCE_ONLY=false
          ALREADY_IMPORTED=false
          UPLOAD_COMMIT=''
          ARCHIVE_SHA=''

          if [[ -s incoming/memo.zip ]]; then
            if [[ "${#PRESENT_ZIPS[@]}" -ne 1 || "${PRESENT_ZIPS[0]}" != 'incoming/memo.zip' ]]; then
              echo "::error::Keep exactly one ZIP directly inside incoming/, named memo.zip. Found ${#PRESENT_ZIPS[@]} ZIP file(s)."
              printf ' - %s\n' "${PRESENT_ZIPS[@]:-none}"
              exit 1
            fi

            UPLOAD_COMMIT="$(git log -1 --format=%H "$GITHUB_SHA" -- incoming/memo.zip)"
            if [[ ! "$UPLOAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Could not identify the commit that uploaded incoming/memo.zip.'
              exit 1
            fi
            ARCHIVE_SHA="$(sha256sum incoming/memo.zip | awk '{print $1}')"

            git fetch --no-tags origin "$GITHUB_REF_NAME"
            NOTE_PATH="notes/imports/${UPLOAD_COMMIT}.md"
            if git cat-file -e "FETCH_HEAD:$NOTE_PATH" 2>/dev/null; then
              ALREADY_IMPORTED=true
              echo 'This exact archive upload commit already has an import note.'
            fi

            if [[ "$GITHUB_EVENT_NAME" == "push" && "$DIRECT_SOURCE_CHANGE" -gt 0 && "$INCOMING_ARCHIVE_CHANGE" -eq 0 ]]; then
              # Direct source changes take precedence over the immutable historical ZIP.
              SOURCE_ONLY=true
              ALREADY_IMPORTED=false
              UPLOAD_COMMIT="$GITHUB_SHA"
              ARCHIVE_SHA="$(sha256sum SOURCE_SHA256SUMS.txt | awk '{print $1}')"
              echo 'Direct source verification requested; building the checked-out source without re-extracting the historical ZIP.'
            fi
          else
            if [[ "${#PRESENT_ZIPS[@]}" -ne 0 ]]; then
              echo "::error::Expected the only incoming ZIP to be incoming/memo.zip."
              printf ' - %s\n' "${PRESENT_ZIPS[@]}"
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$DIRECT_SOURCE_CHANGE" -gt 0 ]]; then
              # Source-only commits do not require a historical upload ZIP.
              SOURCE_ONLY=true
              UPLOAD_COMMIT="$GITHUB_SHA"
              ARCHIVE_SHA="$(sha256sum SOURCE_SHA256SUMS.txt | awk '{print $1}')"
              echo 'Direct source verification requested; no incoming ZIP is required.'
            elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo 'No incoming ZIP and no direct source changes. Treating this as a cleanup-only commit.'
              {
                echo 'skip_no_upload=true'
                echo 'already_imported=false'
                echo 'upload_commit='
                echo 'archive_sha='
                echo 'source_only=false'
              } >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo '::error::Expected the complete source archive at incoming/memo.zip.'
              exit 1
            fi
          fi

          {
            echo 'skip_no_upload=false'
            echo "already_imported=$ALREADY_IMPORTED"
            echo "upload_commit=$UPLOAD_COMMIT"
            echo "archive_sha=$ARCHIVE_SHA"
            echo "source_only=$SOURCE_ONLY"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize preflight failure
        if: failure()
        shell: bash
        run: |
          {
            echo '# Memo preflight failed'
            echo
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo '- Expected input: `incoming/memo.zip` (the only ZIP in `incoming/`)'
            echo '- No source files were extracted or committed by this run.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preflight
    if: needs.preflight.outputs.skip_no_upload != 'true' && needs.preflight.outputs.already_imported != 'true'
    name: Validate, extract, synchronize, test and build Memo
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MEMO_UPLOAD_COMMIT: ${{ needs.preflight.outputs.upload_commit }}
      MEMO_ARCHIVE_SHA: ${{ needs.preflight.outputs.archive_sha }}
      MEMO_SOURCE_ONLY: ${{ needs.preflight.outputs.source_only }}
    steps:
      - name: Check out the exact upload revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize build log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/Memo-Build.log"
          echo "MEMO_BUILD_LOG=$RUNNER_TEMP/Memo-Build.log" >> "$GITHUB_ENV"
          echo "MEMO_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "Branch: $GITHUB_REF_NAME" | tee -a "$RUNNER_TEMP/Memo-Build.log"
          echo "Upload commit: $MEMO_UPLOAD_COMMIT" | tee -a "$RUNNER_TEMP/Memo-Build.log"
          echo "Archive SHA-256: $MEMO_ARCHIVE_SHA" | tee -a "$RUNNER_TEMP/Memo-Build.log"
          if [[ "$MEMO_SOURCE_ONLY" == 'true' ]]; then
            printf '%s  SOURCE_SHA256SUMS.txt (source-only verification fingerprint)\n' "$MEMO_ARCHIVE_SHA" > "$RUNNER_TEMP/Memo-Source-SHA256.txt"
          else
            printf '%s  incoming/memo.zip\n' "$MEMO_ARCHIVE_SHA" > "$RUNNER_TEMP/Memo-Source-SHA256.txt"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Set up pinned Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
          validate-wrappers: false

      - name: Validate ZIP and safely extract the complete Android project
        if: needs.preflight.outputs.source_only != 'true'
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/incoming/memo.zip"
          STAGING="$RUNNER_TEMP/memo-source-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          test -s "$ZIP_FILE"
          sha256sum "$ZIP_FILE" | tee -a "$MEMO_BUILD_LOG"

          cat > "$RUNNER_TEMP/validate_memo_zip.py" <<'PY'
          import hashlib
          import re
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath, PureWindowsPath

          archive = Path(sys.argv[1])
          staging = Path(sys.argv[2]).resolve()
          max_archive = 1024 * 1024 * 1024
          max_total = 3 * 1024 * 1024 * 1024
          max_file = 768 * 1024 * 1024
          max_entries = 75000
          max_ratio = 1000
          skip_dirs = {'.git', '.gradle', 'build', '__pycache__', 'node_modules', '.idea', '.kotlin', '.cxx', '.externalNativeBuild', 'captures', '.venv', 'venv'}
          secret_suffixes = {'.jks', '.keystore', '.p12', '.pfx', '.pem', '.p8', '.key', '.mobileprovision'}
          secret_names = {'local.properties', '.env', '.npmrc', '.pypirc', '.netrc', 'keystore.properties', 'key.properties', 'signing.properties'}
          secret_patterns = [
              re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(rb'\bAKIA[0-9A-Z]{16}\b'),
              re.compile(rb'\bAIza[0-9A-Za-z_-]{35}\b'),
              re.compile(rb'\bgh[pousr]_[A-Za-z0-9]{30,}\b'),
          ]

          def fail(message):
              raise SystemExit('ZIP validation failed: ' + message)

          if not archive.is_file() or archive.stat().st_size <= 0 or archive.stat().st_size > max_archive:
              fail('archive missing, empty or larger than the 1 GiB compressed limit')

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos or len(infos) > max_entries:
                  fail(f'archive entry count outside safe limits: {len(infos)}')
              total = sum(i.file_size for i in infos)
              if total > max_total:
                  fail(f'total uncompressed size exceeds limit: {total}')

              seen = set()
              safe = []
              for info in infos:
                  name = info.filename
                  if not name or '\\' in name or name.startswith('/') or PureWindowsPath(name).drive:
                      fail(f'unsafe absolute or platform-specific path: {name!r}')
                  raw_parts = name.rstrip('/').split('/')
                  if any(part in ('', '.', '..') for part in raw_parts):
                      fail(f'path traversal or ambiguous path: {name!r}')
                  rel = PurePosixPath(*raw_parts)
                  key = rel.as_posix().casefold()
                  if key in seen:
                      fail(f'duplicate or case-colliding path: {name!r}')
                  seen.add(key)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode) or (mode and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode))):
                      fail(f'symlink or special file is forbidden: {name!r}')
                  if info.flag_bits & 0x1:
                      fail(f'encrypted ZIP entries are forbidden: {name!r}')
                  if info.file_size > max_file:
                      fail(f'file exceeds per-file limit: {name!r}')
                  if info.file_size and (info.compress_size == 0 or info.file_size / max(info.compress_size, 1) > max_ratio):
                      fail(f'suspicious compression ratio: {name!r}')
                  if '.git' in rel.parts:
                      fail(f'Git metadata must not be embedded in the source ZIP: {name!r}')
                  if rel.name.lower() in secret_names or rel.suffix.lower() in secret_suffixes:
                      fail(f'private machine/signing material is not allowed in the source ZIP: {name!r}')
                  if any(p.lower() in skip_dirs for p in rel.parts):
                      continue
                  if not info.is_dir():
                      if info.file_size <= 4 * 1024 * 1024:
                          data = zf.read(info)
                          if any(pattern.search(data) for pattern in secret_patterns):
                              fail(f'possible credential/private key content detected: {name!r}')
                      safe.append((info, rel))

              # Verify CRCs before writing any file to the staging directory.
              bad = zf.testzip()
              if bad:
                  fail(f'CRC validation failed for {bad!r}')

              zf.extractall(staging, members=[info for info, _ in safe] + [i for i in infos if i.is_dir() and not any(p.lower() in skip_dirs for p in PurePosixPath(i.filename.rstrip('/')).parts)])

          roots = []
          for settings in list(staging.rglob('settings.gradle')) + list(staging.rglob('settings.gradle.kts')):
              root = settings.parent
              app_gradle = (root / 'app/build.gradle').is_file() or (root / 'app/build.gradle.kts').is_file()
              if (root / 'gradlew').is_file() and app_gradle and (root / 'app/src/main/AndroidManifest.xml').is_file():
                  roots.append(root)
          roots = sorted(set(roots))
          if len(roots) != 1:
              fail(f'Expected exactly one Android Gradle project root; found {len(roots)}')
          project = roots[0]
          required = [
              'settings.gradle', 'build.gradle', 'gradlew', 'app/src/main/AndroidManifest.xml',
              'gradle/wrapper/gradle-wrapper.properties', 'TASKS.md',
              'SOURCE_SHA256SUMS.txt', 'tools/verify_source.py',
          ]
          for rel in required:
              if not (project / rel).is_file():
                  fail(f'required project file missing: {rel}')
          if not ((project / 'core/build.gradle').is_file() or (project / 'core/build.gradle.kts').is_file()):
              fail('platform-independent :core module build file is missing')

          manifest = project / 'SOURCE_SHA256SUMS.txt'
          checked = 0
          seen_manifest = set()
          for line_no, line in enumerate(manifest.read_text(encoding='utf-8').splitlines(), 1):
              raw = line.strip()
              if not raw:
                  continue
              match = re.match(r'^([0-9a-fA-F]{64}) [ *](.+)$', raw)
              if not match:
                  fail(f'invalid source checksum manifest line {line_no}')
              expected, name = match.groups()
              name = name.removeprefix('./')
              parts = name.split('/')
              if not name or '\\' in name or name.startswith('/') or any(p in ('', '.', '..') for p in parts):
                  fail(f'unsafe checksum path at line {line_no}')
              rel = PurePosixPath(*parts)
              key = rel.as_posix()
              if key in seen_manifest:
                  fail(f'duplicate checksum entry: {key}')
              seen_manifest.add(key)
              target = project.joinpath(*rel.parts)
              if not target.is_file() or target.is_symlink():
                  fail(f'checksum target missing or not a regular file: {key}')
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual.lower() != expected.lower():
                  fail(f'source checksum mismatch: {key}')
              checked += 1
          if checked == 0:
              fail('source checksum manifest contains no file entries')

          rel_root = project.relative_to(staging).as_posix()
          (staging / 'project-root.txt').write_text(rel_root + '\n', encoding='utf-8')
          (staging / 'Memo-Project-Root-Detection.txt').write_text(
              '\n'.join([
                  'Memo ZIP validation: PASS',
                  f'Archive bytes: {archive.stat().st_size}',
                  f'ZIP entries inspected: {len(infos)}',
                  f'Source checksum entries verified: {checked}',
                  f'Detected Android project root: {rel_root}',
                  'Import mode: exact project snapshot (stale source files are removed)',
                  'Protected repository paths: .git/, .github/, incoming/, notes/',
              ]) + '\n', encoding='utf-8')
          print((staging / 'Memo-Project-Root-Detection.txt').read_text(encoding='utf-8'))
          PY

          python3 "$RUNNER_TEMP/validate_memo_zip.py" "$ZIP_FILE" "$STAGING" 2>&1 | tee -a "$MEMO_BUILD_LOG"
          PROJECT_ROOT_REL="$(cat "$STAGING/project-root.txt")"
          PROJECT_ROOT="$STAGING/$PROJECT_ROOT_REL"
          echo "MEMO_STAGING_DIR=$STAGING" >> "$GITHUB_ENV"
          echo "MEMO_STAGED_PROJECT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected source root: $PROJECT_ROOT" | tee -a "$MEMO_BUILD_LOG"

      - name: Replace the repository project tree with the ZIP snapshot
        if: needs.preflight.outputs.source_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d "$MEMO_STAGED_PROJECT"
          mkdir -p "$GITHUB_WORKSPACE/incoming" "$GITHUB_WORKSPACE/notes/imports"
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/incoming/' \
            --exclude='/notes/' \
            --exclude='**/.gradle/' \
            --exclude='**/build/' \
            --exclude='**/__pycache__/' \
            --exclude='**/node_modules/' \
            --exclude='**/.idea/' \
            --exclude='**/.kotlin/' \
            --exclude='**/.cxx/' \
            --exclude='**/.externalNativeBuild/' \
            --exclude='**/captures/' \
            --exclude='**/.venv/' \
            --exclude='**/venv/' \
            --exclude='**/local.properties' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='**/*.jks' \
            --exclude='**/*.keystore' \
            --exclude='**/*.p12' \
            --exclude='**/*.pfx' \
            --exclude='**/*.pem' \
            --exclude='**/*.key' \
            --exclude='**/*signing*.properties' \
            --exclude='**/*credentials*.json' \
            --exclude='**/*secret*.json' \
            --exclude='**/*token*.json' \
            --exclude='**/service-account*.json' \
            "$MEMO_STAGED_PROJECT/" "$GITHUB_WORKSPACE/" 2>&1 | tee -a "$MEMO_BUILD_LOG"

          test -s settings.gradle || test -s settings.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s TASKS.md
          test -s tools/verify_source.py
          echo 'Exact source snapshot synchronized. Old root ZIPs, stale source files and prior project-only files were removed.' | tee -a "$MEMO_BUILD_LOG"

          GIT_EXCLUDE="$(git rev-parse --git-path info/exclude)"
          cat >> "$GIT_EXCLUDE" <<'EXCLUDES'
          /incoming/
          /delivery/
          /.gradle/
          **/.gradle/
          **/build/
          **/__pycache__/
          **/node_modules/
          **/.idea/
          **/.kotlin/
          **/.cxx/
          **/.externalNativeBuild/
          **/captures/
          **/local.properties
          **/.env
          **/.env.*
          **/*.jks
          **/*.keystore
          **/*.p12
          **/*.pfx
          **/*.pem
          **/*.key
          **/*signing*.properties
          **/*credentials*.json
          **/*secret*.json
          **/*token*.json
          **/service-account*.json
          EXCLUDES
          echo "MEMO_PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Use checked-out repository source for direct verification
        if: needs.preflight.outputs.source_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle || test -s settings.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s TASKS.md
          test -s tools/verify_source.py
          echo "MEMO_PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'Using the committed repository source directly; no stale upload ZIP was extracted.' | tee -a "$MEMO_BUILD_LOG"

      - name: Refresh source checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          cat > .gitignore <<'IGNORE'
          **/build/
          **/.gradle/
          **/__pycache__/
          **/.kotlin/
          **/.cxx/
          **/.externalNativeBuild/
          **/captures/
          **/.venv/
          **/venv/
          **/node_modules/
          **/.idea/
          **/local.properties
          **/*.apk
          **/*.aab
          **/*.class
          **/*.pyc
          **/*.pyo
          **/*.log
          **/*.tmp
          **/*.swp
          **/*.bak
          **/*~
          IGNORE
          find . -type f \
            ! -path './.git/*' ! -path './incoming/*' ! -path './notes/*' \
            ! -path '*/.gradle/*' ! -path '*/build/*' ! -path '*/__pycache__/*' \
            ! -path '*/node_modules/*' ! -path '*/.idea/*' ! -path '*/.kotlin/*' \
            ! -path '*/.cxx/*' ! -path '*/.externalNativeBuild/*' ! -path '*/captures/*' \
            ! -path '*/.venv/*' ! -path '*/venv/*' \
            ! -name '*.zip' ! -name 'SOURCE_SHA256SUMS.txt' \
            ! -name 'local.properties' ! -name '.env' ! -name '.env.*' \
            ! -name '*.jks' ! -name '*.keystore' ! -name '*.p12' ! -name '*.pfx' \
            ! -name '*.pem' ! -name '*.key' ! -name '*signing*.properties' \
            ! -name '*credentials*.json' ! -name '*secret*.json' ! -name '*token*.json' \
            ! -name 'service-account*.json' ! -name '*.tmp' ! -name '*.swp' \
            ! -name '*.bak' ! -name '*.log' ! -name '*~' \
            -print0 | sort -z | xargs -0 -r sha256sum > SOURCE_SHA256SUMS.txt
          sha256sum -c SOURCE_SHA256SUMS.txt 2>&1 | tee -a "$MEMO_BUILD_LOG"
          echo 'Source checksum manifest regenerated and verified.' | tee -a "$MEMO_BUILD_LOG"

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          python3 tools/verify_source.py 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Test the remote runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          if [[ -d remote-runner/tests ]]; then
            (cd remote-runner && python3 -m unittest discover -s tests -v) 2>&1 | tee -a "$MEMO_BUILD_LOG"
          else
            echo 'Remote runner test suite is missing.' | tee -a "$MEMO_BUILD_LOG"
            exit 1
          fi

      - name: Run Android unit tests, lint and assemble the debug APK
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          gradle --no-daemon --stacktrace \
            :core:test \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Verify APK identity and signature
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          APK="$MEMO_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK" || { echo '::error::Debug APK was not produced.'; exit 1; }
          test -x "$AAPT" && test -x "$APKSIGNER" || { echo '::error::Android APK tools are unavailable.'; exit 1; }
          VERSION_FIELDS="$(python3 - <<'PY'
          import os, re
          from pathlib import Path
          source_path = next((p for p in (Path('app/build.gradle'), Path('app/build.gradle.kts')) if p.is_file()), None)
          if source_path is None:
              raise SystemExit('app/build.gradle(.kts) is missing')
          source = source_path.read_text(encoding='utf-8')
          code = re.search(r'\bversionCode\s*(?:=\s*)?(\d+)', source)
          default_code = re.search(r"""System\.getenv\(['"]GITHUB_RUN_NUMBER['"]\)\s*\?:\s*['"](\d+)['"]""", source)
          name = re.search(r'\bversionName\s*(?:=\s*)?[\'"]([^\'"]+)[\'"]', source)
          if not (code or default_code) or not name:
              raise SystemExit('Could not read versionCode default/versionName from app Gradle file')
          print(os.environ.get('GITHUB_RUN_NUMBER') or (code or default_code).group(1))
          print(name.group(1) + '-debug')
          PY
          )"
          mapfile -t VERSION_PARTS <<< "$VERSION_FIELDS"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          if [[ "$PACKAGE_LINE" != *"name='app.memo.android.debug'"* ]]; then
            echo '::error::APK application ID changed; expected app.memo.android.debug.'
            printf '%s\n' "$PACKAGE_LINE"
            exit 1
          fi
          [[ "$PACKAGE_LINE" == *"versionCode='${VERSION_PARTS[0]}'"* ]] || { echo '::error::APK versionCode differs from source.'; exit 1; }
          [[ "$PACKAGE_LINE" == *"versionName='${VERSION_PARTS[1]}'"* ]] || { echo '::error::APK versionName differs from source.'; exit 1; }
          "$APKSIGNER" verify --verbose "$APK" 2>&1 | tee -a "$MEMO_BUILD_LOG"
          {
            echo 'Memo build APK identity verification: PASS'
            echo 'Package: app.memo.android.debug'
            echo "Version code: ${VERSION_PARTS[0]}"
            echo "Version name: ${VERSION_PARTS[1]}"
            echo 'Build/test signature: ephemeral CI debug key; final signing is isolated.'
          } | tee "$RUNNER_TEMP/Memo-APK-Identity.txt" | tee -a "$MEMO_BUILD_LOG"

      - name: Prove install-over-existing preserves app-private data
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          APK="$MEMO_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          CURRENT_APK="$RUNNER_TEMP/Memo-current.apk"
          BASELINE_APK="$RUNNER_TEMP/Memo-baseline.apk"
          cp "$APK" "$CURRENT_APK"
          CURRENT_CODE="$GITHUB_RUN_NUMBER"
          BASELINE_CODE="$((CURRENT_CODE - 1))"
          if (( BASELINE_CODE < 1 )); then
            echo '::error::Cannot create a lower-version install baseline.'
            exit 1
          fi

          MEMO_VERSION_CODE="$BASELINE_CODE" gradle --no-daemon :app:assembleDebug 2>&1 | tee -a "$MEMO_BUILD_LOG"
          cp "$APK" "$BASELINE_APK"
          MEMO_VERSION_CODE="$CURRENT_CODE" gradle --no-daemon :app:assembleDebug 2>&1 | tee -a "$MEMO_BUILD_LOG"
          cp "$CURRENT_APK" "$APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BASELINE_META="$("$AAPT" dump badging "$BASELINE_APK" | grep -m1 '^package:')"
          CURRENT_META="$("$AAPT" dump badging "$CURRENT_APK" | grep -m1 '^package:')"
          [[ "$BASELINE_META" == *"name='app.memo.android.debug'"* && "$CURRENT_META" == *"name='app.memo.android.debug'"* ]] || {
            echo '::error::Install-upgrade package identity changed between builds.'
            exit 1
          }
          [[ "$BASELINE_META" == *"versionCode='$BASELINE_CODE'"* && "$CURRENT_META" == *"versionCode='$CURRENT_CODE'"* ]] || {
            echo '::error::Install-upgrade version codes are not strictly increasing.'
            printf '%s\n%s\n' "$BASELINE_META" "$CURRENT_META"
            exit 1
          }

          AVDMANAGER="$(command -v avdmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager -print -quit)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$EMULATOR" && test -n "$AVDMANAGER" && test -x "$AVDMANAGER"

          # avdmanager and the emulator must use the same AVD home. On hosted
          # runners, an inherited SDK/user-home setting can otherwise make
          # avdmanager report success while the emulator searches ~/.android/avd.
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          export ANDROID_SDK_HOME="$HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name memo-api35 \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_2 2>&1 | tee -a "$MEMO_BUILD_LOG"
          if [[ ! -s "$ANDROID_AVD_HOME/memo-api35.ini" ]]; then
            echo '::error::avdmanager did not create memo-api35 in the configured AVD home.'
            echo "Configured AVD home: $ANDROID_AVD_HOME"
            find "$HOME/.android" -maxdepth 3 -type f -name '*.ini' -print 2>/dev/null || true
            exit 1
          fi
          "$EMULATOR" -list-avds | tee -a "$MEMO_BUILD_LOG"
          if [[ ! -e /dev/kvm ]]; then
            echo '::error::The hosted runner does not expose /dev/kvm; the x86_64 Android emulator cannot run.'
            exit 1
          fi
          # The ephemeral hosted-runner user is not always in the kvm group.
          # Restrict this permission change to the disposable CI VM.
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::The runner still cannot read/write /dev/kvm after permission setup.'
            ls -l /dev/kvm || true
            exit 1
          fi
          ls -l /dev/kvm | tee -a "$MEMO_BUILD_LOG"
          "$EMULATOR" -avd memo-api35 -accel on -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > "$RUNNER_TEMP/memo-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          diagnose_emulator() {
            echo '--- Android emulator process diagnostics ---'
            adb devices -l || true
            if [[ -f "$RUNNER_TEMP/memo-emulator.log" ]]; then
              tail -n 160 "$RUNNER_TEMP/memo-emulator.log"
            fi
          }
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap 'status=$?; if (( status != 0 )); then diagnose_emulator; fi; cleanup; exit "$status"' EXIT
          echo 'Waiting up to 120 seconds for the Android emulator transport.'
          timeout 120s adb wait-for-device
          echo 'Waiting up to 180 seconds for Android framework boot.'
          BOOTED=''
          for attempt in $(seq 1 60); do
            BOOTED="$(timeout 8s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [[ "$BOOTED" == '1' ]] && break
            sleep 3
          done
          [[ "$BOOTED" == '1' ]] || {
            echo '::error::Android emulator did not finish booting within 3 minutes.'
            exit 1
          }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          INSTRUMENTATION_APK="$MEMO_PROJECT_DIR/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$INSTRUMENTATION_APK" || {
            echo '::error::Encrypted-store Android instrumentation APK was not produced.'
            exit 1
          }
          TEST_RUNNER='app.memo.android.debug.test/androidx.test.runner.AndroidJUnitRunner'
          run_store_acceptance_phase() {
            local phase="$1"
            local output="$RUNNER_TEMP/Memo-store-$phase.txt"
            echo "Running encrypted-store acceptance phase: $phase"
            adb shell am instrument -w -e phase "$phase" "$TEST_RUNNER" 2>&1 | tee "$output" | tee -a "$MEMO_BUILD_LOG"
            if ! grep -Fq 'OK (1 test)' "$output"; then
              echo "::error::Encrypted-store instrumentation phase '$phase' did not report one passing test."
              cat "$output"
              exit 1
            fi
          }

          adb install "$BASELINE_APK" 2>&1 | tee -a "$MEMO_BUILD_LOG"
          adb install "$INSTRUMENTATION_APK" 2>&1 | tee -a "$MEMO_BUILD_LOG"
          run_store_acceptance_phase seed

          # Keep the old sentinel as a supplemental generic sandbox check; encrypted-store
          # acceptance above/below proves the actual Keystore-backed data can be reopened.
          adb shell "run-as app.memo.android.debug sh -c 'mkdir -p files/.memo-upgrade-test && printf \"%s\" \"memo-private-data-survives-update\" > files/.memo-upgrade-test/sentinel'"

          adb install -r "$CURRENT_APK" 2>&1 | tee -a "$MEMO_BUILD_LOG"
          run_store_acceptance_phase verify

          PRESERVED="$(adb shell run-as app.memo.android.debug cat files/.memo-upgrade-test/sentinel | tr -d '\r')"
          [[ "$PRESERVED" == 'memo-private-data-survives-update' ]] || {
            echo '::error::App-private data did not survive the in-place APK update.'
            exit 1
          }
          echo 'PASS: signed in-place upgrade preserved app-private data and both real encrypted Memo stores; legacy recovery and corruption tests passed.' | tee -a "$MEMO_BUILD_LOG"

      - name: Update build status and create a permanent import note
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MEMO_SOURCE_ONLY" == 'true' ]]; then
            INPUT_LABEL='direct repository source'
            ZIP_GATE='not applicable (direct source verification)'
          else
            INPUT_LABEL='incoming/memo.zip'
            ZIP_GATE='PASS'
          fi
          cd "$GITHUB_WORKSPACE"
          mkdir -p notes/imports
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          NOTE="notes/imports/${MEMO_UPLOAD_COMMIT}.md"
          cat > "$NOTE" <<NOTE_TEXT
          # Memo source import

          - Upload commit: \`$MEMO_UPLOAD_COMMIT\`
          - Input: $INPUT_LABEL
          - Source fingerprint SHA-256: \`$MEMO_ARCHIVE_SHA\`
          - Integration date: $DATE_UTC
          - Branch: \`$GITHUB_REF_NAME\`
          - Workflow run: $MEMO_RUN_URL
          - Result: all required checks passed; source snapshot committed after build

          ## Gates

          - ZIP safety, CRC, project-root and source-manifest validation: $ZIP_GATE
          - Memo source invariants: PASS
          - Remote-runner tests: PASS
          - \`:core:test\`: PASS
          - \`:app:testDebugUnitTest\`: PASS
          - \`:app:lintDebug\`: PASS
          - \`:app:assembleDebug\`: PASS
          - APK package/version and CI debug-signature verification: PASS
          - Build/test signature: ephemeral CI debug key; final pinned signing is isolated.

          For ZIP imports, the original upload remains immutable in Git history. Direct-source verification never re-extracts the historical ZIP. The extracted project is an exact snapshot; the live workflow, Git metadata, incoming upload and permanent import notes are preserved.
          NOTE_TEXT

          if [[ ! -s notes/README.md ]]; then
            cat > notes/README.md <<'INDEX'
          # Memo import history

          Each successful upload to `incoming/memo.zip` creates a permanent note under `notes/imports/`, keyed by the upload commit SHA.
          INDEX
          fi
          printf '\n- [%s](imports/%s.md) — %s; archive SHA-256 `%s`\n' \
            "${MEMO_UPLOAD_COMMIT:0:12}" "$MEMO_UPLOAD_COMMIT" "$DATE_UTC" "$MEMO_ARCHIVE_SHA" >> notes/README.md

          if [[ -f BUILD_STATUS.md ]]; then
            cat >> BUILD_STATUS.md <<STATUS

          ## Automated import — $DATE_UTC

          - Source revision: \`$MEMO_UPLOAD_COMMIT\`
          - Archive SHA-256: \`$MEMO_ARCHIVE_SHA\`
          - Required source, runner, JVM, lint and APK identity gates: PASS
          - Build/test signature: ephemeral CI debug key; final pinned signing is isolated.
          - Workflow run: $MEMO_RUN_URL
          STATUS
          fi

          echo "Permanent import note created: $NOTE" | tee -a "$MEMO_BUILD_LOG"

      - name: Regenerate the checksum manifest after CI handoff updates
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          find . -type f \
            ! -path './.git/*' ! -path './incoming/*' ! -path './notes/*' \
            ! -path '*/.gradle/*' ! -path '*/build/*' ! -path '*/__pycache__/*' \
            ! -path '*/node_modules/*' ! -path '*/.idea/*' ! -path '*/.kotlin/*' \
            ! -path '*/.cxx/*' ! -path '*/.externalNativeBuild/*' ! -path '*/captures/*' \
            ! -path '*/.venv/*' ! -path '*/venv/*' \
            ! -name '*.zip' ! -name 'SOURCE_SHA256SUMS.txt' \
            ! -name 'local.properties' ! -name '.env' ! -name '.env.*' \
            ! -name '*.jks' ! -name '*.keystore' ! -name '*.p12' ! -name '*.pfx' \
            ! -name '*.pem' ! -name '*.key' ! -name '*signing*.properties' \
            ! -name '*credentials*.json' ! -name '*secret*.json' ! -name '*token*.json' \
            ! -name 'service-account*.json' ! -name '*.tmp' ! -name '*.swp' \
            ! -name '*.bak' ! -name '*.log' ! -name '*~' \
            -print0 | sort -z | xargs -0 -r sha256sum > SOURCE_SHA256SUMS.txt
          sha256sum -c SOURCE_SHA256SUMS.txt 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Prepare debug APK, integrated repository ZIP and checksums
        id: delivery
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          DELIVERY="$RUNNER_TEMP/memo-delivery"
          rm -rf "$DELIVERY"
          mkdir -p "$DELIVERY"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" "$DELIVERY/Memo-Android-debug-ci-signed.apk"
          cp "$RUNNER_TEMP/Memo-Source-SHA256.txt" "$DELIVERY/Memo-Source-Archive-SHA256.txt"

          REPO_ZIP="$DELIVERY/Memo-Android-Integrated-Repository.zip"
          zip -qr "$REPO_ZIP" . \
            -x '.git/*' 'incoming/memo.zip' '*/.gradle/*' '*/build/*' '*/__pycache__/*' \
               '*/node_modules/*' '*/.idea/*' '*/.kotlin/*' '*/.cxx/*' \
               '*/.externalNativeBuild/*' '*/captures/*' '*/.venv/*' '*/venv/*' \
               '*/local.properties' '*/.env' '*/.env.*' '*/.jks' '*/.keystore' \
               '*/.p12' '*/.pfx' '*/.pem' '*/.key' '*/delivery/*'
          (cd "$DELIVERY" && sha256sum Memo-Android-debug-ci-signed.apk Memo-Android-Integrated-Repository.zip Memo-Source-Archive-SHA256.txt > SHA256SUMS.txt)
          echo "Prepared APK and full integrated repository snapshot." | tee -a "$MEMO_BUILD_LOG"

      - name: Upload CI-debug-signed build/test APK for isolated re-signing
        if: always() && steps.delivery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-ci-debug-APK
          path: |
            ${{ runner.temp }}/memo-delivery/Memo-Android-debug-ci-signed.apk
            ${{ runner.temp }}/memo-delivery/Memo-Source-Archive-SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload integrated repository artifact
        if: always() && steps.delivery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-Integrated-Repository
          path: |
            ${{ runner.temp }}/memo-delivery/Memo-Android-Integrated-Repository.zip
            ${{ runner.temp }}/memo-delivery/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload source and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-Build-Reports
          path: |
            ${{ runner.temp }}/Memo-Build.log
            ${{ runner.temp }}/Memo-Source-SHA256.txt
            ${{ runner.temp }}/Memo-APK-Identity.txt
            ${{ runner.temp }}/Memo-Project-Root-Detection.txt
            ${{ runner.temp }}/memo-source-staging/**
            ${{ github.workspace }}/app/build/reports/**
            ${{ github.workspace }}/app/build/test-results/**
            ${{ github.workspace }}/core/build/reports/**
            ${{ github.workspace }}/core/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14


  sign:
    name: Sign the verified APK in an isolated job
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the CI-debug-signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Memo-Android-ci-debug-APK
          path: ${{ runner.temp }}/memo-unsigned

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'build-tools;35.0.0'

      - name: Sign and verify the APK (no project scripts are executed)
        shell: bash
        env:
          MEMO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MEMO_UPLOAD_KEYSTORE_BASE64 }}
          MEMO_UPLOAD_STORE_PASSWORD: ${{ secrets.MEMO_UPLOAD_STORE_PASSWORD || secrets.MEMO_KEYSTORE_PASSWORD }}
          MEMO_UPLOAD_KEY_ALIAS: ${{ secrets.MEMO_UPLOAD_KEY_ALIAS || secrets.MEMO_KEY_ALIAS }}
          MEMO_UPLOAD_KEY_PASSWORD: ${{ secrets.MEMO_UPLOAD_KEY_PASSWORD || secrets.MEMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("${MEMO_UPLOAD_KEYSTORE_BASE64:-}" "${MEMO_UPLOAD_STORE_PASSWORD:-}" "${MEMO_UPLOAD_KEY_ALIAS:-}" "${MEMO_UPLOAD_KEY_PASSWORD:-}")
          nonempty=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && nonempty=$((nonempty + 1)); done
          if [[ "$nonempty" -ne 4 ]]; then
            echo '::error::All four persistent Memo signing secrets must be configured.'
            exit 1
          fi
          INPUT="$RUNNER_TEMP/memo-unsigned/Memo-Android-debug-ci-signed.apk"
          SOURCE_SHA="$RUNNER_TEMP/memo-unsigned/Memo-Source-Archive-SHA256.txt"
          KEYSTORE="$RUNNER_TEMP/memo-upload-signing.jks"
          ALIGNED="$RUNNER_TEMP/Memo-Android-debug-aligned.apk"
          DELIVERY="$RUNNER_TEMP/memo-signed"
          mkdir -p "$DELIVERY"
          SIGNED="$DELIVERY/Memo-Android-debug.apk"
          test -s "$INPUT" && test -s "$SOURCE_SHA"
          printf '%s' "$MEMO_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT
          keytool -list -keystore "$KEYSTORE" -storepass "$MEMO_UPLOAD_STORE_PASSWORD" -alias "$MEMO_UPLOAD_KEY_ALIAS" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT" && test -x "$ZIPALIGN" && test -x "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$INPUT" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$MEMO_UPLOAD_KEY_ALIAS" --ks-pass env:MEMO_UPLOAD_STORE_PASSWORD --key-pass env:MEMO_UPLOAD_KEY_PASSWORD --out "$SIGNED" "$ALIGNED"
          BADGING="$("$AAPT" dump badging "$SIGNED")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          [[ "$PACKAGE_LINE" == *"name='app.memo.android.debug'"* ]] || {
            echo '::error::Signed APK application ID changed.'
            printf '%s\n' "$PACKAGE_LINE"
            exit 1
          }
          "$ZIPALIGN" -c -p 4 "$SIGNED"
          SIGNATURE="$("$APKSIGNER" verify --verbose --print-certs "$SIGNED" 2>&1)"
          printf '%s\n' "$SIGNATURE"
          CERT="$(printf '%s\n' "$SIGNATURE" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+).*/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_MEMO_CERT_SHA256='a15b8b21e4d9ef43cbba01e8230491796c75c6ee41b3f5c674558aced5fb134a'
          [[ "$CERT" == "$EXPECTED_MEMO_CERT_SHA256" ]] || {
            echo '::error::Persistent Memo signing certificate mismatch. Refusing to publish an incompatible APK.'
            exit 1
          }
          {
            echo 'Memo APK identity verification: PASS'
            echo 'Package: app.memo.android.debug'
            echo "Certificate SHA-256: $CERT"
            echo 'Signing mode: pinned persistent upload keystore (isolated signing job)'
          } > "$DELIVERY/Memo-APK-Identity.txt"
          cp "$SOURCE_SHA" "$DELIVERY/Memo-Source-Archive-SHA256.txt"
          (cd "$DELIVERY" && sha256sum Memo-Android-debug.apk Memo-APK-Identity.txt Memo-Source-Archive-SHA256.txt > SHA256SUMS.txt)
          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Upload final pinned-certificate APK
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-debug-APK
          path: |
            ${{ runner.temp }}/memo-signed/Memo-Android-debug.apk
            ${{ runner.temp }}/memo-signed/Memo-APK-Identity.txt
            ${{ runner.temp }}/memo-signed/Memo-Source-Archive-SHA256.txt
            ${{ runner.temp }}/memo-signed/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  commit:
    name: Commit validated source in a separate write-only job
    needs: [preflight, build, sign]
    if: github.event_name != 'pull_request' && needs.build.result == 'success' && needs.sign.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEMO_UPLOAD_COMMIT: ${{ needs.preflight.outputs.upload_commit }}
      MEMO_ARCHIVE_SHA: ${{ needs.preflight.outputs.archive_sha }}
    steps:
      - name: Check out the triggering revision for the handoff commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download the integrated repository snapshot
        uses: actions/download-artifact@v4
        with:
          name: Memo-Android-Integrated-Repository
          path: ${{ runner.temp }}/memo-integrated

      - name: Safely restore the validated repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/memo-integrated/Memo-Android-Integrated-Repository.zip"
          STAGING="$RUNNER_TEMP/memo-commit-tree"
          test -s "$ARCHIVE"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          python3 - "$ARCHIVE" "$STAGING" <<'PY'
          import os, stat, sys, zipfile
          from pathlib import Path, PureWindowsPath
          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          max_archive = 1024 * 1024 * 1024
          max_total = 3 * 1024 * 1024 * 1024
          max_file = 768 * 1024 * 1024
          if archive.stat().st_size > max_archive:
              raise SystemExit('Repository artifact exceeds the 1 GiB compressed limit')
          seen = set()
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos or len(infos) > 75000:
                  raise SystemExit('Repository artifact entry count outside safe limits')
              if sum(info.file_size for info in infos) > max_total:
                  raise SystemExit('Repository artifact exceeds the 3 GiB uncompressed limit')
              if any(info.file_size > max_file for info in infos):
                  raise SystemExit('Repository artifact contains an oversized file')
              bad_member = zf.testzip()
              if bad_member:
                  raise SystemExit(f'Repository artifact CRC failure: {bad_member!r}')
              for info in zf.infolist():
                  name = info.filename
                  while name.startswith('./'):
                      name = name[2:]
                  if not name:
                      continue
                  if name.startswith('/') or chr(92) in name or PureWindowsPath(name).drive:
                      raise SystemExit(f'Unsafe archive path: {info.filename!r}')
                  parts = name.rstrip('/').split('/')
                  if any(part in ('', '.', '..') for part in parts):
                      raise SystemExit(f'Unsafe archive path: {info.filename!r}')
                  if '.git' in parts or (parts[0] == 'incoming' and parts not in (['incoming'], ['incoming', '.gitkeep'])):
                      raise SystemExit(f'Protected path in repository artifact: {info.filename!r}')
                  key = '/'.join(parts)
                  if key in seen:
                      raise SystemExit(f'Duplicate archive path: {key!r}')
                  seen.add(key)
                  mode = (info.external_attr >> 16) & 0xffff
                  if stat.S_ISLNK(mode) or (mode and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode))):
                      raise SystemExit(f'Symlink or special file is forbidden: {key!r}')
                  target = destination.joinpath(*parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open('wb') as output:
                          import shutil
                          shutil.copyfileobj(source, output, length=1024 * 1024)
                      if mode:
                          os.chmod(target, mode & 0o755)
          PY
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' --exclude='/incoming/' "$STAGING/" "$GITHUB_WORKSPACE/"

      - name: Commit without executing repository source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::The branch advanced during the build. No integration commit was pushed; rerun against the newest revision.'
            echo "Trigger SHA: $GITHUB_SHA"
            echo "Remote SHA: $REMOTE_SHA"
            exit 1
          fi
          git add -A -- . \
            ':(exclude,glob)**/build/**' \
            ':(exclude,glob)**/.gradle/**' \
            ':(exclude,glob)**/__pycache__/**' \
            ':(exclude,glob)**/.kotlin/**' \
            ':(exclude,glob)**/.cxx/**' \
            ':(exclude,glob)**/.externalNativeBuild/**' \
            ':(exclude,glob)**/captures/**' \
            ':(exclude,glob)**/node_modules/**' \
            ':(exclude,glob)**/.idea/**' \
            ':(exclude,glob)**/*.apk' \
            ':(exclude,glob)**/*.aab' \
            ':(exclude,glob)**/*.class' \
            ':(exclude,glob)**/*.pyc' \
            ':(exclude,glob)**/*.log' \
            ':(exclude,glob)**/*.tmp' \
            ':(exclude,glob)**/*.swp' \
            ':(exclude,glob)**/*.bak' \
            ':(exclude,glob)**/*~' \
            ':(exclude,glob)incoming/memo.zip'
          git reset --quiet -- incoming/memo.zip || true
          python3 - <<'PY'
          import re, subprocess, sys
          raw = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z'])
          paths = [p.decode('utf-8', 'surrogateescape') for p in raw.split(bytes([0])) if p]
          pattern = re.compile(r'(^|/)(?:[.]env(?:[.].*)?|[.]npmrc|[.]pypirc|[.]netrc|local[.]properties|[^/]*[.](?:jks|keystore|p12|pfx|pem|key|mobileprovision)|id_rsa[^/]*|[^/]*(?:signing|credentials)[^/]*[.]properties|[^/]*(?:credentials|secret|token)[^/]*[.]json|service-account[^/]*[.]json)$', re.I)
          bad = [path for path in paths if pattern.search(path)]
          if bad:
              print('::error::Refusing to commit private configuration or signing material:', file=sys.stderr)
              for path in bad:
                  print(' - ' + path, file=sys.stderr)
              raise SystemExit(1)
          PY
          if git diff --cached --quiet; then
            echo 'No source or handoff changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Import Memo source snapshot ${MEMO_UPLOAD_COMMIT:0:12}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          {
            echo '## Memo import complete'
            echo
            echo "- Source fingerprint SHA-256: `$MEMO_ARCHIVE_SHA`"
            echo '- Build/test ran without signing secrets or repository write credentials.'
            echo '- Persistent signing ran in an isolated job with no repository write permission.'
            echo '- Source handoff commit ran in a separate job with no signing secrets and no project-code execution.'
            echo '- Final APK artifact: **Memo-Android-debug-APK**'
            echo '- Integrated repository artifact: **Memo-Android-Integrated-Repository**'
          } >> "$GITHUB_STEP_SUMMARY"

