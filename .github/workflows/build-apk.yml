name: Build Memo APK

on:
push:
paths:
- "*.zip"
- ".github/workflows/build-apk.yml"
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Find and extract Memo ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE=""

      for candidate in \
        "Memo-Android-Repository.zip" \
        "Memo-Android-Full-Fixed-v2 (1).zip" \
        "Memo-Android-Full-Fixed-v2.zip"
      do
        if [ -f "$candidate" ]; then
          ZIP_FILE="$candidate"
          break
        fi
      done

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No expected Memo ZIP found in repository root."
        echo "Available ZIP files:"
        find . -maxdepth 1 -type f -name "*.zip" -print
        exit 1
      fi

      echo "Using archive: $ZIP_FILE"

      mkdir -p "$RUNNER_TEMP/memo-source"
      unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/memo-source"

      GRADLE_FILE="$(find "$RUNNER_TEMP/memo-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

      if [ -z "$GRADLE_FILE" ]; then
        echo "ERROR: No Gradle settings file found inside the ZIP."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$GRADLE_FILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Memo project found at: $PROJECT_DIR"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    shell: bash
    run: |
      set -euo pipefail
      sdkmanager --licenses < /dev/null || true
      sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "cmake;3.22.1" \
        "ndk;27.2.12479018"

  - name: Build and test Memo
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      chmod +x gradlew

      ./gradlew --no-daemon --stacktrace \
        :core:test \
        testDebugUnitTest \
        lintDebug \
        assembleDebug

  - name: Prepare APK
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p delivery

      APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"

      if [ -z "$APK_FILE" ]; then
        echo "ERROR: Build finished without producing a debug APK."
        exit 1
      fi

      cp "$APK_FILE" delivery/Memo-Android-debug.apk
      sha256sum delivery/Memo-Android-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Memo-Android-debug-APK
      path: delivery/Memo-Android-debug.apk
      if-no-files-found: error
      compression-level: 0
      retention-days: 14
