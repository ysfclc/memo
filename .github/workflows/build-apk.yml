name: Build Memo APK

'on':
  push:
    paths:
      - "Memo-Android-Repository.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract canonical source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Memo-Android-Repository.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in the repository root."
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/memo-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/memo-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/memo-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::The ZIP does not contain a Gradle settings file."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK/cmdline-tools."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          echo "$SDK/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for file in gradlew settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts core/build.gradle.kts gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Run tests, lint, and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew --no-daemon --stacktrace \
            :core:test \
            testDebugUnitTest \
            lintDebug \
            assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery

          APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::The build did not produce a debug APK."
            exit 1
          fi

          cp "$APK_FILE" delivery/Memo-Android-debug.apk
          sha256sum delivery/Memo-Android-debug.apk > delivery/SHA256SUMS.txt
          cat delivery/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-debug-APK
          path: delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
