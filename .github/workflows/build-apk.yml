name: Memo — Import source ZIP and build Android APK

'on':
  push:
    branches:
      - ysfclc-patch-1
    paths:
      - 'incoming/memo.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'tools/**'
      - 'MEMO2_ALIGNMENT_MATRIX.md'
      - 'PRODUCT_GAP_REGISTRY.md'
      - 'FEATURE_AUDIT.md'
      - 'ROADMAP.md'
      - 'TASKS.md'
      - 'README.md'
      - 'docs/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memo-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the one incoming/memo.zip upload
    runs-on: ubuntu-latest
    outputs:
      skip_no_upload: ${{ steps.resolve.outputs.skip_no_upload }}
      already_imported: ${{ steps.resolve.outputs.already_imported }}
      upload_commit: ${{ steps.resolve.outputs.upload_commit }}
      archive_sha: ${{ steps.resolve.outputs.archive_sha }}
      source_only: ${{ steps.resolve.outputs.source_only }}
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the upload commit and enforce the single-ZIP contract
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "ysfclc-patch-1" ]]; then
            echo "::error::Memo source imports are restricted to ysfclc-patch-1. Current ref: $GITHUB_REF"
            exit 1
          fi

          mapfile -t PRESENT_ZIPS < <(find incoming -maxdepth 1 -type f -iname '*.zip' -print 2>/dev/null | sort)
          if [[ ! -s incoming/memo.zip ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "${#PRESENT_ZIPS[@]}" -eq 0 ]]; then
              echo 'No incoming ZIP remains. Treating this as a cleanup-only commit; no build is needed.'
              {
                echo 'skip_no_upload=true'
                echo 'already_imported=false'
                echo 'upload_commit='
                echo 'archive_sha='
              echo 'source_only=false'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo '::error::Expected the complete source archive at incoming/memo.zip.'
            exit 1
          fi
          if [[ "${#PRESENT_ZIPS[@]}" -ne 1 || "${PRESENT_ZIPS[0]}" != 'incoming/memo.zip' ]]; then
            echo "::error::Keep exactly one ZIP directly inside incoming/, named memo.zip. Found ${#PRESENT_ZIPS[@]} ZIP file(s)."
            printf ' - %s\n' "${PRESENT_ZIPS[@]:-none}"
            exit 1
          fi

          UPLOAD_COMMIT="$(git log -1 --format=%H "$GITHUB_SHA" -- incoming/memo.zip)"
          if [[ ! "$UPLOAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Could not identify the commit that uploaded incoming/memo.zip.'
            exit 1
          fi
          ARCHIVE_SHA="$(sha256sum incoming/memo.zip | awk '{print $1}')"

          git fetch --no-tags origin "$GITHUB_REF_NAME"
          NOTE_PATH="notes/imports/${UPLOAD_COMMIT}.md"
          ALREADY_IMPORTED=false
          SOURCE_ONLY=false
          if git cat-file -e "FETCH_HEAD:$NOTE_PATH" 2>/dev/null; then
            ALREADY_IMPORTED=true
            echo 'This exact archive upload commit already has an import note.'
          fi
          if [[ "$ALREADY_IMPORTED" == true && "$GITHUB_EVENT_NAME" == "push" ]] && git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Eq '^(.github/workflows/build-apk.yml|app/|core/|gradle/|tools/|docs/|README[.]md$|TASKS[.]md$|ROADMAP[.]md$|FEATURE_AUDIT[.]md$|PRODUCT_GAP_REGISTRY[.]md$|MEMO2_ALIGNMENT_MATRIX[.]md$|.*[.]gradle([.]kts)?$|gradle[.]properties$|settings[.]gradle([.]kts)?$)'; then
            SOURCE_ONLY=true
            ALREADY_IMPORTED=false
            UPLOAD_COMMIT="$GITHUB_SHA"
            ARCHIVE_SHA="$(sha256sum SOURCE_SHA256SUMS.txt | awk '{print $1}')"
            echo 'Direct source verification requested by a workflow maintenance commit; building the checked-out source without re-extracting the old ZIP.'
          fi
          {
            echo 'skip_no_upload=false'
            echo "already_imported=$ALREADY_IMPORTED"
            echo "upload_commit=$UPLOAD_COMMIT"
            echo "archive_sha=$ARCHIVE_SHA"
            echo "source_only=$SOURCE_ONLY"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize preflight failure
        if: failure()
        shell: bash
        run: |
          {
            echo '# Memo preflight failed'
            echo
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo '- Expected input: `incoming/memo.zip` (the only ZIP in `incoming/`)'
            echo '- No source files were extracted or committed by this run.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preflight
    if: needs.preflight.outputs.skip_no_upload != 'true' && needs.preflight.outputs.already_imported != 'true'
    name: Validate, extract, synchronize, test and build Memo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MEMO_UPLOAD_COMMIT: ${{ needs.preflight.outputs.upload_commit }}
      MEMO_ARCHIVE_SHA: ${{ needs.preflight.outputs.archive_sha }}
      MEMO_SOURCE_ONLY: ${{ needs.preflight.outputs.source_only }}
    steps:
      - name: Check out the exact upload revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Initialize build log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/Memo-Build.log"
          echo "MEMO_BUILD_LOG=$RUNNER_TEMP/Memo-Build.log" >> "$GITHUB_ENV"
          echo "MEMO_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "Branch: $GITHUB_REF_NAME" | tee -a "$RUNNER_TEMP/Memo-Build.log"
          echo "Upload commit: $MEMO_UPLOAD_COMMIT" | tee -a "$RUNNER_TEMP/Memo-Build.log"
          echo "Archive SHA-256: $MEMO_ARCHIVE_SHA" | tee -a "$RUNNER_TEMP/Memo-Build.log"
          if [[ "$MEMO_SOURCE_ONLY" == 'true' ]]; then
            printf '%s  SOURCE_SHA256SUMS.txt (source-only verification fingerprint)\n' "$MEMO_ARCHIVE_SHA" > "$RUNNER_TEMP/Memo-Source-SHA256.txt"
          else
            printf '%s  incoming/memo.zip\n' "$MEMO_ARCHIVE_SHA" > "$RUNNER_TEMP/Memo-Source-SHA256.txt"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Set up pinned Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
          validate-wrappers: false

      - name: Validate ZIP and safely extract the complete Android project
        if: needs.preflight.outputs.source_only != 'true'
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/incoming/memo.zip"
          STAGING="$RUNNER_TEMP/memo-source-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          test -s "$ZIP_FILE"
          sha256sum "$ZIP_FILE" | tee -a "$MEMO_BUILD_LOG"

          cat > "$RUNNER_TEMP/validate_memo_zip.py" <<'PY'
          import hashlib
          import re
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath, PureWindowsPath

          archive = Path(sys.argv[1])
          staging = Path(sys.argv[2]).resolve()
          max_archive = 1024 * 1024 * 1024
          max_total = 3 * 1024 * 1024 * 1024
          max_file = 768 * 1024 * 1024
          max_entries = 75000
          max_ratio = 1000
          skip_dirs = {'.git', '.gradle', 'build', '__pycache__', 'node_modules', '.idea', '.kotlin', '.cxx', '.externalNativeBuild', 'captures', '.venv', 'venv'}
          secret_suffixes = {'.jks', '.keystore', '.p12', '.pfx', '.pem', '.p8', '.key', '.mobileprovision'}
          secret_names = {'local.properties', '.env', '.npmrc', '.pypirc', '.netrc', 'keystore.properties', 'key.properties', 'signing.properties'}
          secret_patterns = [
              re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(rb'\bAKIA[0-9A-Z]{16}\b'),
              re.compile(rb'\bAIza[0-9A-Za-z_-]{35}\b'),
              re.compile(rb'\bgh[pousr]_[A-Za-z0-9]{30,}\b'),
          ]

          def fail(message):
              raise SystemExit('ZIP validation failed: ' + message)

          if not archive.is_file() or archive.stat().st_size <= 0 or archive.stat().st_size > max_archive:
              fail('archive missing, empty or larger than the 1 GiB compressed limit')

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos or len(infos) > max_entries:
                  fail(f'archive entry count outside safe limits: {len(infos)}')
              total = sum(i.file_size for i in infos)
              if total > max_total:
                  fail(f'total uncompressed size exceeds limit: {total}')

              seen = set()
              safe = []
              for info in infos:
                  name = info.filename
                  if not name or '\\' in name or name.startswith('/') or PureWindowsPath(name).drive:
                      fail(f'unsafe absolute or platform-specific path: {name!r}')
                  raw_parts = name.rstrip('/').split('/')
                  if any(part in ('', '.', '..') for part in raw_parts):
                      fail(f'path traversal or ambiguous path: {name!r}')
                  rel = PurePosixPath(*raw_parts)
                  key = rel.as_posix().casefold()
                  if key in seen:
                      fail(f'duplicate or case-colliding path: {name!r}')
                  seen.add(key)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode) or (mode and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode))):
                      fail(f'symlink or special file is forbidden: {name!r}')
                  if info.flag_bits & 0x1:
                      fail(f'encrypted ZIP entries are forbidden: {name!r}')
                  if info.file_size > max_file:
                      fail(f'file exceeds per-file limit: {name!r}')
                  if info.file_size and (info.compress_size == 0 or info.file_size / max(info.compress_size, 1) > max_ratio):
                      fail(f'suspicious compression ratio: {name!r}')
                  if '.git' in rel.parts:
                      fail(f'Git metadata must not be embedded in the source ZIP: {name!r}')
                  if rel.name.lower() in secret_names or rel.suffix.lower() in secret_suffixes:
                      fail(f'private machine/signing material is not allowed in the source ZIP: {name!r}')
                  if any(p.lower() in skip_dirs for p in rel.parts):
                      continue
                  if not info.is_dir():
                      if info.file_size <= 4 * 1024 * 1024:
                          data = zf.read(info)
                          if any(pattern.search(data) for pattern in secret_patterns):
                              fail(f'possible credential/private key content detected: {name!r}')
                      safe.append((info, rel))

              # Verify CRCs before writing any file to the staging directory.
              bad = zf.testzip()
              if bad:
                  fail(f'CRC validation failed for {bad!r}')

              zf.extractall(staging, members=[info for info, _ in safe] + [i for i in infos if i.is_dir() and not any(p.lower() in skip_dirs for p in PurePosixPath(i.filename.rstrip('/')).parts)])

          roots = []
          for settings in list(staging.rglob('settings.gradle')) + list(staging.rglob('settings.gradle.kts')):
              root = settings.parent
              app_gradle = (root / 'app/build.gradle').is_file() or (root / 'app/build.gradle.kts').is_file()
              if (root / 'gradlew').is_file() and app_gradle and (root / 'app/src/main/AndroidManifest.xml').is_file():
                  roots.append(root)
          roots = sorted(set(roots))
          if len(roots) != 1:
              fail(f'Expected exactly one Android Gradle project root; found {len(roots)}')
          project = roots[0]
          required = [
              'settings.gradle', 'build.gradle', 'gradlew', 'app/src/main/AndroidManifest.xml',
              'gradle/wrapper/gradle-wrapper.properties', 'TASKS.md',
              'SOURCE_SHA256SUMS.txt', 'tools/verify_source.py',
          ]
          for rel in required:
              if not (project / rel).is_file():
                  fail(f'required project file missing: {rel}')
          if not ((project / 'core/build.gradle').is_file() or (project / 'core/build.gradle.kts').is_file()):
              fail('platform-independent :core module build file is missing')

          manifest = project / 'SOURCE_SHA256SUMS.txt'
          checked = 0
          seen_manifest = set()
          for line_no, line in enumerate(manifest.read_text(encoding='utf-8').splitlines(), 1):
              raw = line.strip()
              if not raw:
                  continue
              match = re.match(r'^([0-9a-fA-F]{64}) [ *](.+)$', raw)
              if not match:
                  fail(f'invalid source checksum manifest line {line_no}')
              expected, name = match.groups()
              name = name.removeprefix('./')
              parts = name.split('/')
              if not name or '\\' in name or name.startswith('/') or any(p in ('', '.', '..') for p in parts):
                  fail(f'unsafe checksum path at line {line_no}')
              rel = PurePosixPath(*parts)
              key = rel.as_posix()
              if key in seen_manifest:
                  fail(f'duplicate checksum entry: {key}')
              seen_manifest.add(key)
              target = project.joinpath(*rel.parts)
              if not target.is_file() or target.is_symlink():
                  fail(f'checksum target missing or not a regular file: {key}')
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual.lower() != expected.lower():
                  fail(f'source checksum mismatch: {key}')
              checked += 1
          if checked == 0:
              fail('source checksum manifest contains no file entries')

          rel_root = project.relative_to(staging).as_posix()
          (staging / 'project-root.txt').write_text(rel_root + '\n', encoding='utf-8')
          (staging / 'Memo-Project-Root-Detection.txt').write_text(
              '\n'.join([
                  'Memo ZIP validation: PASS',
                  f'Archive bytes: {archive.stat().st_size}',
                  f'ZIP entries inspected: {len(infos)}',
                  f'Source checksum entries verified: {checked}',
                  f'Detected Android project root: {rel_root}',
                  'Import mode: exact project snapshot (stale source files are removed)',
                  'Protected repository paths: .git/, .github/, incoming/, notes/',
              ]) + '\n', encoding='utf-8')
          print((staging / 'Memo-Project-Root-Detection.txt').read_text(encoding='utf-8'))
          PY

          python3 "$RUNNER_TEMP/validate_memo_zip.py" "$ZIP_FILE" "$STAGING" 2>&1 | tee -a "$MEMO_BUILD_LOG"
          PROJECT_ROOT_REL="$(cat "$STAGING/project-root.txt")"
          PROJECT_ROOT="$STAGING/$PROJECT_ROOT_REL"
          echo "MEMO_STAGING_DIR=$STAGING" >> "$GITHUB_ENV"
          echo "MEMO_STAGED_PROJECT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected source root: $PROJECT_ROOT" | tee -a "$MEMO_BUILD_LOG"

      - name: Replace the repository project tree with the ZIP snapshot
        if: needs.preflight.outputs.source_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d "$MEMO_STAGED_PROJECT"
          mkdir -p "$GITHUB_WORKSPACE/incoming" "$GITHUB_WORKSPACE/notes/imports"
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/incoming/' \
            --exclude='/notes/' \
            --exclude='**/.gradle/' \
            --exclude='**/build/' \
            --exclude='**/__pycache__/' \
            --exclude='**/node_modules/' \
            --exclude='**/.idea/' \
            --exclude='**/.kotlin/' \
            --exclude='**/.cxx/' \
            --exclude='**/.externalNativeBuild/' \
            --exclude='**/captures/' \
            --exclude='**/.venv/' \
            --exclude='**/venv/' \
            --exclude='**/local.properties' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='**/*.jks' \
            --exclude='**/*.keystore' \
            --exclude='**/*.p12' \
            --exclude='**/*.pfx' \
            --exclude='**/*.pem' \
            --exclude='**/*.key' \
            --exclude='**/*signing*.properties' \
            --exclude='**/*credentials*.json' \
            --exclude='**/*secret*.json' \
            --exclude='**/*token*.json' \
            --exclude='**/service-account*.json' \
            "$MEMO_STAGED_PROJECT/" "$GITHUB_WORKSPACE/" 2>&1 | tee -a "$MEMO_BUILD_LOG"

          test -s settings.gradle || test -s settings.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s TASKS.md
          test -s tools/verify_source.py
          echo 'Exact source snapshot synchronized. Old root ZIPs, stale source files and prior project-only files were removed.' | tee -a "$MEMO_BUILD_LOG"

          GIT_EXCLUDE="$(git rev-parse --git-path info/exclude)"
          cat >> "$GIT_EXCLUDE" <<'EXCLUDES'
          /incoming/
          /delivery/
          /.gradle/
          **/.gradle/
          **/build/
          **/__pycache__/
          **/node_modules/
          **/.idea/
          **/.kotlin/
          **/.cxx/
          **/.externalNativeBuild/
          **/captures/
          **/local.properties
          **/.env
          **/.env.*
          **/*.jks
          **/*.keystore
          **/*.p12
          **/*.pfx
          **/*.pem
          **/*.key
          **/*signing*.properties
          **/*credentials*.json
          **/*secret*.json
          **/*token*.json
          **/service-account*.json
          EXCLUDES
          echo "MEMO_PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Use checked-out repository source for direct verification
        if: needs.preflight.outputs.source_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle || test -s settings.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s TASKS.md
          test -s tools/verify_source.py
          echo "MEMO_PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'Using the committed repository source directly; no stale upload ZIP was extracted.' | tee -a "$MEMO_BUILD_LOG"

      - name: Configure optional persistent APK signing
        shell: bash
        env:
          MEMO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MEMO_UPLOAD_KEYSTORE_BASE64 }}
          MEMO_UPLOAD_STORE_PASSWORD: ${{ secrets.MEMO_UPLOAD_STORE_PASSWORD || secrets.MEMO_KEYSTORE_PASSWORD }}
          MEMO_UPLOAD_KEY_ALIAS: ${{ secrets.MEMO_UPLOAD_KEY_ALIAS || secrets.MEMO_KEY_ALIAS }}
          MEMO_UPLOAD_KEY_PASSWORD: ${{ secrets.MEMO_UPLOAD_KEY_PASSWORD || secrets.MEMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("${MEMO_UPLOAD_KEYSTORE_BASE64:-}" "${MEMO_UPLOAD_STORE_PASSWORD:-}" "${MEMO_UPLOAD_KEY_ALIAS:-}" "${MEMO_UPLOAD_KEY_PASSWORD:-}")
          nonempty=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && nonempty=$((nonempty + 1)); done
          if [[ "$nonempty" -ne 0 && "$nonempty" -ne 4 ]]; then
            echo '::error::Memo signing secrets are partially configured. Set all four signing secrets or remove all four.'
            exit 1
          fi
          if [[ "$nonempty" -ne 4 ]]; then
            echo '::error::Persistent Memo signing is mandatory. Refusing to create an APK with a temporary or different certificate.'
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/memo-upload-signing.jks"
          printf '%s' "$MEMO_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$MEMO_UPLOAD_STORE_PASSWORD" -alias "$MEMO_UPLOAD_KEY_ALIAS" >/dev/null
          {
            echo "MEMO_UPLOAD_KEYSTORE_FILE=$KEYSTORE"
            echo "MEMO_UPLOAD_STORE_PASSWORD=$MEMO_UPLOAD_STORE_PASSWORD"
            echo "MEMO_UPLOAD_KEY_ALIAS=$MEMO_UPLOAD_KEY_ALIAS"
            echo "MEMO_UPLOAD_KEY_PASSWORD=$MEMO_UPLOAD_KEY_PASSWORD"
            echo 'MEMO_SIGNING_MODE=pinned persistent upload keystore'
          } >> "$GITHUB_ENV"
          echo 'Pinned persistent signing configured; temporary debug signing is disabled.' | tee -a "$MEMO_BUILD_LOG"

      - name: Refresh source checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          cat > .gitignore <<'IGNORE'
          **/build/
          **/.gradle/
          **/__pycache__/
          **/.kotlin/
          **/.cxx/
          **/.externalNativeBuild/
          **/captures/
          **/.venv/
          **/venv/
          **/node_modules/
          **/.idea/
          **/local.properties
          **/*.apk
          **/*.aab
          **/*.class
          **/*.pyc
          **/*.pyo
          **/*.log
          **/*.tmp
          **/*.swp
          **/*.bak
          **/*~
          IGNORE
          find . -type f \
            ! -path './.git/*' ! -path './incoming/*' ! -path './notes/*' \
            ! -path '*/.gradle/*' ! -path '*/build/*' ! -path '*/__pycache__/*' \
            ! -path '*/node_modules/*' ! -path '*/.idea/*' ! -path '*/.kotlin/*' \
            ! -path '*/.cxx/*' ! -path '*/.externalNativeBuild/*' ! -path '*/captures/*' \
            ! -path '*/.venv/*' ! -path '*/venv/*' \
            ! -name '*.zip' ! -name 'SOURCE_SHA256SUMS.txt' \
            ! -name 'local.properties' ! -name '.env' ! -name '.env.*' \
            ! -name '*.jks' ! -name '*.keystore' ! -name '*.p12' ! -name '*.pfx' \
            ! -name '*.pem' ! -name '*.key' ! -name '*signing*.properties' \
            ! -name '*credentials*.json' ! -name '*secret*.json' ! -name '*token*.json' \
            ! -name 'service-account*.json' ! -name '*.tmp' ! -name '*.swp' \
            ! -name '*.bak' ! -name '*.log' ! -name '*~' \
            -print0 | sort -z | xargs -0 -r sha256sum > SOURCE_SHA256SUMS.txt
          sha256sum -c SOURCE_SHA256SUMS.txt 2>&1 | tee -a "$MEMO_BUILD_LOG"
          echo 'Source checksum manifest regenerated and verified.' | tee -a "$MEMO_BUILD_LOG"

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          python3 tools/verify_source.py 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Test the remote runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          if [[ -d remote-runner/tests ]]; then
            (cd remote-runner && python3 -m unittest discover -s tests -v) 2>&1 | tee -a "$MEMO_BUILD_LOG"
          else
            echo 'Remote runner test suite is missing.' | tee -a "$MEMO_BUILD_LOG"
            exit 1
          fi

      - name: Run Android unit tests, lint and assemble the debug APK
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          gradle --no-daemon --stacktrace \
            :core:test \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Verify APK identity and signature
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          APK="$MEMO_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK" || { echo '::error::Debug APK was not produced.'; exit 1; }
          test -x "$AAPT" && test -x "$APKSIGNER" || { echo '::error::Android APK tools are unavailable.'; exit 1; }
          VERSION_FIELDS="$(python3 - <<'PY'
          import os, re
          from pathlib import Path
          source_path = next((p for p in (Path('app/build.gradle'), Path('app/build.gradle.kts')) if p.is_file()), None)
          if source_path is None:
              raise SystemExit('app/build.gradle(.kts) is missing')
          source = source_path.read_text(encoding='utf-8')
          code = re.search(r'\bversionCode\s*(?:=\s*)?(\d+)', source)
          default_code = re.search(r"""System\.getenv\(['"]GITHUB_RUN_NUMBER['"]\)\s*\?:\s*['"](\d+)['"]""", source)
          name = re.search(r'\bversionName\s*(?:=\s*)?[\'"]([^\'"]+)[\'"]', source)
          if not (code or default_code) or not name:
              raise SystemExit('Could not read versionCode default/versionName from app Gradle file')
          print(os.environ.get('GITHUB_RUN_NUMBER') or (code or default_code).group(1))
          print(name.group(1) + '-debug')
          PY
          )"
          mapfile -t VERSION_PARTS <<< "$VERSION_FIELDS"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          if [[ "$PACKAGE_LINE" != *"name='app.memo.android.debug'"* ]]; then
            echo '::error::APK application ID changed; expected app.memo.android.debug.'
            printf '%s\n' "$PACKAGE_LINE"
            exit 1
          fi
          [[ "$PACKAGE_LINE" == *"versionCode='${VERSION_PARTS[0]}'"* ]] || { echo '::error::APK versionCode differs from source.'; exit 1; }
          [[ "$PACKAGE_LINE" == *"versionName='${VERSION_PARTS[1]}'"* ]] || { echo '::error::APK versionName differs from source.'; exit 1; }
          SIGNATURE="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE" | tee -a "$MEMO_BUILD_LOG"
          CERT="$(printf '%s\n' "$SIGNATURE" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+).*/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT" || { echo '::error::APK signing certificate could not be verified.'; exit 1; }
          EXPECTED_MEMO_CERT_SHA256='a15b8b21e4d9ef43cbba01e8230491796c75c6ee41b3f5c674558aced5fb134a'
          [[ "$CERT" == "$EXPECTED_MEMO_CERT_SHA256" ]] || { echo '::error::Memo signing certificate changed. Refusing to publish an APK that may require uninstalling the installed app.'; exit 1; }
          {
            echo 'Memo APK identity verification: PASS'
            echo 'Package: app.memo.android.debug'
            echo "Version code: ${VERSION_PARTS[0]}"
            echo "Version name: ${VERSION_PARTS[1]}"
            echo "Certificate SHA-256: $CERT"
            echo "Signing mode: ${MEMO_SIGNING_MODE:-unknown}"
          } | tee "$RUNNER_TEMP/Memo-APK-Identity.txt" | tee -a "$MEMO_BUILD_LOG"

      - name: Update build status and create a permanent import note
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p notes/imports
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          NOTE="notes/imports/${MEMO_UPLOAD_COMMIT}.md"
          cat > "$NOTE" <<NOTE_TEXT
          # Memo source import

          - Upload commit: \`$MEMO_UPLOAD_COMMIT\`
          - Input: \`incoming/memo.zip\`
          - Source fingerprint SHA-256: \`$MEMO_ARCHIVE_SHA\`
          - Integration date: $DATE_UTC
          - Branch: \`$GITHUB_REF_NAME\`
          - Workflow run: $MEMO_RUN_URL
          - Result: all required checks passed; source snapshot committed after build

          ## Gates

          - ZIP safety, CRC, project-root and source-manifest validation: PASS
          - Memo source invariants: PASS
          - Remote-runner tests: PASS
          - \`:core:test\`: PASS
          - \`:app:testDebugUnitTest\`: PASS
          - \`:app:lintDebug\`: PASS
          - \`:app:assembleDebug\`: PASS
          - APK package/version/signature verification: PASS
          - Signing mode: \`${MEMO_SIGNING_MODE:-unknown}\`

          The uploaded ZIP is retained as the immutable input in Git history. The extracted source is an exact project snapshot: stale source files absent from the archive are removed. The live workflow, Git metadata, incoming upload and permanent import notes are preserved.
          NOTE_TEXT

          if [[ ! -s notes/README.md ]]; then
            cat > notes/README.md <<'INDEX'
          # Memo import history

          Each successful upload to `incoming/memo.zip` creates a permanent note under `notes/imports/`, keyed by the upload commit SHA.
          INDEX
          fi
          printf '\n- [%s](imports/%s.md) — %s; archive SHA-256 `%s`\n' \
            "${MEMO_UPLOAD_COMMIT:0:12}" "$MEMO_UPLOAD_COMMIT" "$DATE_UTC" "$MEMO_ARCHIVE_SHA" >> notes/README.md

          if [[ -f BUILD_STATUS.md ]]; then
            cat >> BUILD_STATUS.md <<STATUS

          ## Automated import — $DATE_UTC

          - Source upload commit: \`$MEMO_UPLOAD_COMMIT\`
          - Archive SHA-256: \`$MEMO_ARCHIVE_SHA\`
          - Required source, runner, JVM, lint and APK identity gates: PASS
          - Signing mode: ${MEMO_SIGNING_MODE:-unknown}
          - Workflow run: $MEMO_RUN_URL
          STATUS
          fi

          echo "Permanent import note created: $NOTE" | tee -a "$MEMO_BUILD_LOG"

      - name: Regenerate the checksum manifest after CI handoff updates
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"
          find . -type f \
            ! -path './.git/*' ! -path './incoming/*' ! -path './notes/*' \
            ! -path '*/.gradle/*' ! -path '*/build/*' ! -path '*/__pycache__/*' \
            ! -path '*/node_modules/*' ! -path '*/.idea/*' ! -path '*/.kotlin/*' \
            ! -path '*/.cxx/*' ! -path '*/.externalNativeBuild/*' ! -path '*/captures/*' \
            ! -path '*/.venv/*' ! -path '*/venv/*' \
            ! -name '*.zip' ! -name 'SOURCE_SHA256SUMS.txt' \
            ! -name 'local.properties' ! -name '.env' ! -name '.env.*' \
            ! -name '*.jks' ! -name '*.keystore' ! -name '*.p12' ! -name '*.pfx' \
            ! -name '*.pem' ! -name '*.key' ! -name '*signing*.properties' \
            ! -name '*credentials*.json' ! -name '*secret*.json' ! -name '*token*.json' \
            ! -name 'service-account*.json' ! -name '*.tmp' ! -name '*.swp' \
            ! -name '*.bak' ! -name '*.log' ! -name '*~' \
            -print0 | sort -z | xargs -0 -r sha256sum > SOURCE_SHA256SUMS.txt
          sha256sum -c SOURCE_SHA256SUMS.txt 2>&1 | tee -a "$MEMO_BUILD_LOG"

      - name: Prepare debug APK, integrated repository ZIP and checksums
        id: delivery
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          DELIVERY="$RUNNER_TEMP/memo-delivery"
          rm -rf "$DELIVERY"
          mkdir -p "$DELIVERY"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" "$DELIVERY/Memo-Android-debug.apk"
          cp "$RUNNER_TEMP/Memo-APK-Identity.txt" "$DELIVERY/Memo-APK-Identity.txt"
          cp "$RUNNER_TEMP/Memo-Source-SHA256.txt" "$DELIVERY/Memo-Source-Archive-SHA256.txt"

          REPO_ZIP="$DELIVERY/Memo-Android-Integrated-Repository.zip"
          zip -qr "$REPO_ZIP" . \
            -x '.git/*' 'incoming/memo.zip' '*/.gradle/*' '*/build/*' '*/__pycache__/*' \
               '*/node_modules/*' '*/.idea/*' '*/.kotlin/*' '*/.cxx/*' \
               '*/.externalNativeBuild/*' '*/captures/*' '*/.venv/*' '*/venv/*' \
               '*/local.properties' '*/.env' '*/.env.*' '*/.jks' '*/.keystore' \
               '*/.p12' '*/.pfx' '*/.pem' '*/.key' '*/delivery/*'
          (cd "$DELIVERY" && sha256sum Memo-Android-debug.apk Memo-Android-Integrated-Repository.zip Memo-APK-Identity.txt Memo-Source-Archive-SHA256.txt > SHA256SUMS.txt)
          echo "Prepared APK and full integrated repository snapshot." | tee -a "$MEMO_BUILD_LOG"

      - name: Commit the validated source snapshot and handoff updates
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::The branch advanced during this build. No integration commit was pushed; rerun against the newest upload.'
            echo "Trigger SHA: $GITHUB_SHA" | tee -a "$MEMO_BUILD_LOG"
            echo "Remote SHA: $REMOTE_SHA" | tee -a "$MEMO_BUILD_LOG"
            exit 1
          fi

          # Explicit exclusions are a second line of defence even if a generated file is already staged.
          git add -A -- . \
            ':(exclude,glob)**/build/**' \
            ':(exclude,glob)**/.gradle/**' \
            ':(exclude,glob)**/__pycache__/**' \
            ':(exclude,glob)**/.kotlin/**' \
            ':(exclude,glob)**/.cxx/**' \
            ':(exclude,glob)**/.externalNativeBuild/**' \
            ':(exclude,glob)**/captures/**' \
            ':(exclude,glob)**/node_modules/**' \
            ':(exclude,glob)**/.idea/**' \
            ':(exclude,glob)**/*.apk' \
            ':(exclude,glob)**/*.aab' \
            ':(exclude,glob)**/*.class' \
            ':(exclude,glob)**/*.pyc' \
            ':(exclude,glob)**/*.log' \
            ':(exclude,glob)**/*.tmp' \
            ':(exclude,glob)**/*.swp' \
            ':(exclude,glob)**/*.bak' \
            ':(exclude,glob)**/*~' \
            ':(exclude,glob)incoming/memo.zip'
          # The uploaded source ZIP remains the immutable input commit, not part of the integration commit.
          git reset --quiet -- incoming/memo.zip || true

          python3 - <<'PY'
          import re, subprocess, sys
          raw = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z'])
          paths = [p.decode('utf-8', 'surrogateescape') for p in raw.split(b'\0') if p]
          pattern = re.compile(r'(^|/)(?:\.env(?:\..*)?|local\.properties|[^/]*\.jks|[^/]*\.keystore|[^/]*\.p12|[^/]*\.pfx|[^/]*\.pem|[^/]*\.key|id_rsa[^/]*|[^/]*(?:signing|credentials)[^/]*\.properties)$', re.I)
          bad = [path for path in paths if pattern.search(path)]
          if bad:
              print('::error::Refusing to commit private configuration or signing material:', file=sys.stderr)
              for path in bad:
                  print(' - ' + path, file=sys.stderr)
              raise SystemExit(1)
          PY

          if git diff --cached --quiet; then
            echo 'No source or handoff changes to commit.' | tee -a "$MEMO_BUILD_LOG"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Import Memo source snapshot ${MEMO_UPLOAD_COMMIT:0:12}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          {
            echo '## Memo import complete'
            echo
            echo "- Upload commit: \`$MEMO_UPLOAD_COMMIT\`"
            echo "- Source fingerprint SHA-256: \`$MEMO_ARCHIVE_SHA\`"
            echo '- Source mirror, handoff notes, checksum manifest and build status committed.'
            echo "- APK artifact: **Memo-Android-debug-APK**"
            echo "- Integrated repository artifact: **Memo-Android-Integrated-Repository**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        if: always() && steps.apk_verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-debug-APK
          path: |
            ${{ runner.temp }}/memo-delivery/Memo-Android-debug.apk
            ${{ runner.temp }}/memo-delivery/Memo-APK-Identity.txt
            ${{ runner.temp }}/memo-delivery/Memo-Source-Archive-SHA256.txt
            ${{ runner.temp }}/memo-delivery/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload integrated repository artifact
        if: always() && steps.delivery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-Integrated-Repository
          path: |
            ${{ runner.temp }}/memo-delivery/Memo-Android-Integrated-Repository.zip
            ${{ runner.temp }}/memo-delivery/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload source and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Android-Build-Reports
          path: |
            ${{ runner.temp }}/Memo-Build.log
            ${{ runner.temp }}/Memo-Source-SHA256.txt
            ${{ runner.temp }}/Memo-APK-Identity.txt
            ${{ runner.temp }}/Memo-Project-Root-Detection.txt
            ${{ runner.temp }}/memo-source-staging/**
            ${{ github.workspace }}/app/build/reports/**
            ${{ github.workspace }}/app/build/test-results/**
            ${{ github.workspace }}/core/build/reports/**
            ${{ github.workspace }}/core/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

