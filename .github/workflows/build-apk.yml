
name: Build Memo APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install exact Gradle version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.14.6"
          SHA256="7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24"
          ARCHIVE="$RUNNER_TEMP/gradle-${VERSION}-bin.zip"
          URL="https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"

          curl --fail --location --retry 3 --retry-delay 2 \
            "$URL" --output "$ARCHIVE"

          echo "${SHA256}  ${ARCHIVE}" | sha256sum --check
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          echo "PINNED_GRADLE=$RUNNER_TEMP/gradle-${VERSION}/bin/gradle" \
            >> "$GITHUB_ENV"

      - name: Locate Memo Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Memo-Android/settings.gradle" ] && \
             [ -f "Memo-Android/app/build.gradle" ]; then
            PROJECT_DIR="Memo-Android"
          elif [ -f "settings.gradle" ] && \
               [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          else
            echo "ERROR: Memo Android Gradle project not found."
            echo "Expected Memo-Android/settings.gradle or settings.gradle."
            find . -maxdepth 4 -name settings.gradle -print
            exit 1
          fi

          echo "MEMO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Gradle and project
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          "$PINNED_GRADLE" --version

          ACTUAL_VERSION="$(
            "$PINNED_GRADLE" --version |
            awk '/^Gradle / { print $2; exit }'
          )"

          test "$ACTUAL_VERSION" = "8.14.6"

      - name: Test remote runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR/remote-runner"
          python3 -m unittest discover -s tests -v

      - name: Run Android tests, lint and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$MEMO_PROJECT_DIR"

          "$PINNED_GRADLE" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/$MEMO_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created: $APK"
            find "$GITHUB_WORKSPACE/$MEMO_PROJECT_DIR/app/build/outputs" \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/memo-apk-sha256.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: memo-android-debug-apk
          path: |
            ${{ env.MEMO_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            memo-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
          
