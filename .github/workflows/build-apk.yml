name: Build Memo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Memo-Android-Full-Fixed-v2.zip'
      - 'build-memo-apk.yml'
      - '.github/workflows/build-memo-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and extract exact source package
        shell: bash
        run: |
          set -euo pipefail
          archive="Memo-Android-Full-Fixed-v2.zip"
          test -s "$archive" || { echo "::error::Missing $archive at repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/memo-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/memo-source"
          project="$(find "$RUNNER_TEMP/memo-source" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
          test -n "$project" || { echo "::error::No settings.gradle.kts found in archive"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$project")" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null
      - name: Run tests, lint and build APK
        working-directory: \${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK and checksum
        id: apk
        working-directory: \${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk-sha256.txt"
          echo "path=$PROJECT_DIR/$apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: memo-android-apk
          path: |
            \${{ steps.apk.outputs.path }}
            \${{ runner.temp }}/apk-sha256.txt
          retention-days: 14
          if-no-files-found: error
