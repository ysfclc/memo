plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def memoVersionCodeText = System.getenv('MEMO_VERSION_CODE')
if (!memoVersionCodeText) {
    try {
        def versionProcess = new ProcessBuilder('git', 'log', '-2', '--format=%ct', 'HEAD')
            .redirectErrorStream(true)
            .start()
        def commitTimes = versionProcess.inputStream.getText('UTF-8').readLines().collect { it.trim() }
        if (versionProcess.waitFor() != 0 || commitTimes.size() != 2 ||
                !(commitTimes[0] ==~ /[1-9][0-9]{0,9}/) ||
                !(commitTimes[1] ==~ /[1-9][0-9]{0,9}/)) {
            throw new GradleException("Memo source commit timestamps must be valid.")
        }
        def currentVersionCode = commitTimes[0].toLong() / 4L
        def parentVersionCode = commitTimes[1].toLong() / 4L
        if (currentVersionCode <= parentVersionCode || currentVersionCode > 2100000000L) {
            throw new GradleException("Memo source-derived versionCode must increase and remain within Android's supported maximum.")
        }
        memoVersionCodeText = currentVersionCode.toString()
    } catch (Exception ignored) {
        throw new GradleException("Memo APK builds require MEMO_VERSION_CODE or a valid, monotonic Git checkout; refusing an unsafe fallback version.")
    }
}
if (!(memoVersionCodeText ==~ /[1-9][0-9]{0,9}/)) {
    throw new GradleException("Invalid MEMO_VERSION_CODE: " + memoVersionCodeText)
}
def memoVersionCode = memoVersionCodeText.toInteger()
if (memoVersionCode > 2100000000) {
    throw new GradleException("Memo versionCode exceeds Android's supported maximum: " + memoVersionCode)
}
def memoUploadStoreFile = System.getenv('MEMO_UPLOAD_KEYSTORE_FILE')
def memoUploadStorePassword = System.getenv('MEMO_UPLOAD_STORE_PASSWORD')
def memoUploadKeyAlias = System.getenv('MEMO_UPLOAD_KEY_ALIAS')
def memoUploadKeyPassword = System.getenv('MEMO_UPLOAD_KEY_PASSWORD')
def memoHasUploadSigning = [memoUploadStoreFile, memoUploadStorePassword, memoUploadKeyAlias, memoUploadKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    // Run encrypted-store upgrade instrumentation against the normal release package.
    testBuildType 'release'

    signingConfigs {
        if (memoHasUploadSigning) {
            memoUpload {
                storeFile file(memoUploadStoreFile)
                storePassword memoUploadStorePassword
                keyAlias memoUploadKeyAlias
                keyPassword memoUploadKeyPassword
            }
        }
    }
    namespace 'app.memo.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.memo.android'
        minSdk 29
        targetSdk 35
        versionCode memoVersionCode
        versionName '4.0.0-memo'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (memoHasUploadSigning) {
                signingConfig signingConfigs.memoUpload
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideload/test signing only. Configure a private release key before store distribution.
            if (memoHasUploadSigning) {
                signingConfig signingConfigs.memoUpload
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1'] }
}


dependencies {
    implementation project(':core')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.4.21'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
